    <form>
        <h2>Job Application</h2>
        <label for="name">Name:</label><br>
        <input type="text" id="name"><br>

        <label for="emailid">Email:</label><br>
        <input type="email" id="emailid"><br>

        <label for="pno.">Phone:</label><br>
        <input type="tel" id="pho."><br>

        <label for="resume1">Resume:</label><br>
        <input type="file" name="resume" id="resume1"><br><br>

        <label for="Exp">Experience(in years):</label><br>
        <input type="number" id="Exp" min="0" max="50">
        <fieldset>
            <legend>Skills:</legend>
            <input type="checkbox" id="checkbox1"><br>
            <label for="checkbox1">Html</label><br>

            <input type="checkbox" id="checkbox2"><br>
            <label for="checkbox2">CSS</label><br>

            <input type="checkbox" id="checkbox3"><br>
            <label for="checkbox3">JS</label><br>
        </fieldset>

        <label for="education">Highest Education:</label><br>
        <select name="education" id="education" >
            <option value="" disabled selected>Select an option</option>            <option value="highschool">High School</option>
            <option value="a">A</option>
            <option value="b">B</option>
            <option value="c">C</option>

        </select><br>
        <label for="time">Availability Time:</label><br>
        
        <input type="radio" name="time" id="radio1">
        <label for="radio1">Full Time</label>
<br><br>
        <input type="radio" name="time" id="radio2">
        <label for="radio2">Part Time</label><br><br>

        <label for="cmnts">Additional Comments:</label><br>
        <textarea name="cmnts" id="cmnts" cols="30" rows="6"></textarea>
        
        <button>Submit application</button>


    </form>
