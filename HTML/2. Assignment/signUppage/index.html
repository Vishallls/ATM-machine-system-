<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="outer-box">
       <div class="inner-box">
        <header class="signup-header">
            <h1>Signup Page</h1>
            <p>This will only take few seconds</p>
        </header>            
        
          <main>
            <div class="signup-body">
                <form action="#" width="200">
                        <p>
                            <label for="name">Full Name</label><br>
                            <input type="text" placeholder="Enter your Full Name" id="name"><br>
                        </p>
                        <p>
                            <label for="name"> Your Email</label><br>
                            <input type="text" placeholder="abc123@gmail.com" id="eml"><br>
                        </p>
                        <p>
                            <label for="pass">Your New Password</label><br>
                            <input type="password" placeholder="Atleast 8 characters" id="pswd">
                        </p>
                        <p>
                            <input type="button" value="Create Account">
                        </p>
                </form>
                        
            </div>

          </main>
                <div class="signup-footer">
                    <footer>
                        <p >Already have an Account? <a href="">Login</a></p>
                    </footer>
                </div>   
            
                    
            

        </div>
    </div>
</body>
</html>
