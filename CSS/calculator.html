<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calc.css">
</head>
<body>
    <div class="container">
        <div class="displaybox">
            <input id="placeholder" type="text" placeholder="0">
        </div>

        <div class="operations">
          
                <button id="ac">AC</button>
                <button id="ac">DEL</button>
                <button id="op">%</button>
                <button id="op">/</button>
         
        </div>
        
        <div class="nums">
            <button id="nums">7</button>
            <button id="nums">8</button>
            <button id="nums">9</button>
            <button id="op">*</button>
        </div>
        <div class="nums">
            <button id="nums">4</button>
            <button id="nums">5</button>
            <button id="nums">6</button>
            <button id="op">-</button>
        </div>
        <div class="nums">
            <button id="nums">1</button>
            <button id="nums">2</button>
            <button id="nums">3</button>
            <button id="op">+</button>
        </div>
        <div class="nums">
            <button id="nums">00</button>
            <button id="nums">0</button>
            <button id="dot">.</button>
            <button id="op">=</button>
        </div>





    </div>






    </div>
    
</body>
</html>
